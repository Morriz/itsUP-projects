enabled: true
host: 127.0.0.1
ingress:
  - domain: itsup.srv.instrukt.ai
    path_prefix: /redirect
    port: 8888
    router: http
  # LAN-origin gate: Traefik attributes LAN-hairpin traffic to the gateway,
  # so this address admits the LAN and denies the internet.
  - domain: itsup.srv.instrukt.ai
    path_prefix: /file
    port: 8888
    router: http
    allow_source_ips:
      - 192.168.1.1/32
